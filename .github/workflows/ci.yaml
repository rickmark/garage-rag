name: CI

# Runs the Aspect CLI tasks on ephemeral GitHub-hosted runners. Each task is its
# own job so results show up as separate status checks. The Aspect CLI version is
# pinned by .aspect/version.axl; `setup-aspect` installs it and wires the GitHub
# Actions cache (disk cache, repository cache, and the Bazelisk/Aspect CLI binaries
# themselves), so a warm cache skips re-downloading and re-building from scratch on
# every run. See https://aspect.build/docs/cli/tasks-ci and
# https://github.com/aspect-build/setup-aspect
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # Required by the Aspect CLI artifact upload feature.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aspect-build/setup-aspect@60664fabf0aa15152c69d0ee72c9a660416c7a36 # v2026.38.2
        with:
          disk-cache: true
      - run: aspect test --task:name test -- //...

  gazelle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aspect-build/setup-aspect@60664fabf0aa15152c69d0ee72c9a660416c7a36 # v2026.38.2
        with:
          disk-cache: true
      - run: aspect gazelle --task:name gazelle

  buildifier:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aspect-build/setup-aspect@60664fabf0aa15152c69d0ee72c9a660416c7a36 # v2026.38.2
        with:
          disk-cache: true
      - run: aspect buildifier --task:name buildifier


  format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aspect-build/setup-aspect@60664fabf0aa15152c69d0ee72c9a660416c7a36 # v2026.38.2
        with:
          disk-cache: true
      - run: aspect format --task:name format

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aspect-build/setup-aspect@60664fabf0aa15152c69d0ee72c9a660416c7a36 # v2026.38.2
        with:
          disk-cache: true
      - run: aspect lint --task:name lint -- //...

