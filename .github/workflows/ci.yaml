name: CI

# Runs the Aspect CLI tasks on ephemeral GitHub-hosted runners. Each task is its
# own job so results show up as separate status checks. The Aspect CLI version is
# pinned by .aspect/version.axl; `setup-aspect` installs it and wires the GitHub
# Actions cache. See https://aspect.build/docs/cli/tasks-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # Required by the Aspect CLI artifact upload feature.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies via Brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install aspect-build/aspect/aspect bazelisk
      - run: aspect test --task:name test -- //...

  gazelle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies via Brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install aspect-build/aspect/aspect bazelisk
      - run: aspect gazelle --task:name gazelle

  buildifier:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies via Brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install aspect-build/aspect/aspect bazelisk
      - run: aspect buildifier --task:name buildifier


  format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies via Brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install aspect-build/aspect/aspect bazelisk
      - run: aspect format --task:name format

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies via Brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install aspect-build/aspect/aspect bazelisk
      - run: aspect lint --task:name lint -- //...

