name: CI

# The fast checks every push gets, most of them on Linux:
#
# - `python`: ruff and the whole pytest suite in a uv venv, with a pgvector
#   Postgres service so test_postgres.py runs instead of skipping. It is the same
#   recipe the web-session hook uses (.claude/hooks/session-start.sh).
# - `swiftcheck`: the tree-sitter Swift syntax gate (tools/swiftcheck).
# - `format`, `gazelle`, `buildifier`: the Aspect CLI tasks, which need no Mac.
# - `lint`: stays on macOS, because it analyzes //..., Apple targets included.
#
# The Bazel build and test of //... (the app, Postgres, ICU, Python.framework
# and llama.cpp from source) is in macos.yaml. It runs only when the build could
# have changed, and a newer push does not cancel it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # Required by the Aspect CLI artifact upload feature.
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A superuser: pgvector is not a trusted extension, and each run creates
      # and drops its own garage_test_* database.
      GARAGE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # test_scanner runs git; keep the runner's global config out of it.
      GIT_CONFIG_GLOBAL: /dev/null
    defaults:
      run:
        working-directory: garage_python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: garage_python/pyproject.toml
      - name: Create the venv
        # uv.lock only resolves for macOS, so install from pyproject, as the
        # web-session hook does on Linux.
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv -e '.[dev]'
      - name: ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: pytest
        run: .venv/bin/pytest -q

  swiftcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Swift syntax gate (tree-sitter)
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" tree-sitter tree-sitter-swift
          "$RUNNER_TEMP/venv/bin/python" tools/swiftcheck/swift_syntax_check.py

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-aspect
      - run: aspect format --task:name format

  gazelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-aspect
      - run: aspect gazelle --task:name gazelle

  buildifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-aspect
      - run: aspect buildifier --task:name buildifier

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-aspect
      - run: aspect lint --task:name lint -- //...
