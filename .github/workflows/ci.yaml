name: CI

# Runs the Aspect CLI tasks on ephemeral GitHub-hosted runners. Each task is its
# own job so results show up as separate status checks. The Aspect CLI version
# actually invoked is pinned by .aspect/version.axl; the launcher binary each job
# downloads below is pinned by tools/tools.lock.json (the same lockfile
# //tools:bazel_env reads for local dev), so bumping that file keeps CI in sync
# without touching this workflow. See https://aspect.build/docs/cli/tasks-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # Required by the Aspect CLI artifact upload feature.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies via Brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install bazelisk
      - name: Install Aspect CLI
        run: |
          url=$(jq -r '.aspect.binaries[] | select(.os=="macos" and .cpu=="arm64") | .url' tools/tools.lock.json)
          sha=$(jq -r '.aspect.binaries[] | select(.os=="macos" and .cpu=="arm64") | .sha256' tools/tools.lock.json)
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/aspect" "$url"
          echo "${sha}  $RUNNER_TEMP/bin/aspect" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/bin/aspect"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # A cold build of //... (Postgres, ICU, Python.framework, llama.cpp from
      # source) runs past the hosted runner's 6h job limit, so every run started
      # from nothing and none finished. Bazel's disk and repository caches carry
      # the work across runs instead.
      - name: Restore Bazel caches
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}-
            bazel-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Point Bazel at the caches
        # user.bazelrc is git-ignored and try-imported last by .bazelrc.
        # -MaxFDLimit: on macOS the JVM otherwise caps Bazel's open files at 10240
        # whatever ulimit allows (see the test step).
        run: |
          echo "common --disk_cache=$HOME/.cache/bazel-disk --repository_cache=$HOME/.cache/bazel-repo" >> user.bazelrc
          echo "startup --host_jvm_args=-XX:-MaxFDLimit" >> user.bazelrc
      - run: |
          # Hashing and caching the site-packages tree artifacts (thousands of
          # files each) ran Bazel out of file descriptors ("Too many open files")
          # at the runner's default limit.
          ulimit -n 65536 2>/dev/null || ulimit -n "$(sysctl -n kern.maxfilesperproc)"
          echo "open file limit: $(ulimit -n)"
          aspect test --task:name test -- //...
        # Stop before the 6h limit: a job the runner kills skips its remaining
        # steps, so the save below would never run and the next run would start
        # cold again.
        timeout-minutes: 320
      - name: Save Bazel caches
        if: always() && steps.bazel-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

  gazelle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies via Brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install bazelisk
      - name: Install Aspect CLI
        run: |
          url=$(jq -r '.aspect.binaries[] | select(.os=="macos" and .cpu=="arm64") | .url' tools/tools.lock.json)
          sha=$(jq -r '.aspect.binaries[] | select(.os=="macos" and .cpu=="arm64") | .sha256' tools/tools.lock.json)
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/aspect" "$url"
          echo "${sha}  $RUNNER_TEMP/bin/aspect" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/bin/aspect"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: aspect gazelle --task:name gazelle

  buildifier:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies via Brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install bazelisk
      - name: Install Aspect CLI
        run: |
          url=$(jq -r '.aspect.binaries[] | select(.os=="macos" and .cpu=="arm64") | .url' tools/tools.lock.json)
          sha=$(jq -r '.aspect.binaries[] | select(.os=="macos" and .cpu=="arm64") | .sha256' tools/tools.lock.json)
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/aspect" "$url"
          echo "${sha}  $RUNNER_TEMP/bin/aspect" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/bin/aspect"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: aspect buildifier --task:name buildifier


  format:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies via Brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install bazelisk
      - name: Install Aspect CLI
        run: |
          url=$(jq -r '.aspect.binaries[] | select(.os=="macos" and .cpu=="arm64") | .url' tools/tools.lock.json)
          sha=$(jq -r '.aspect.binaries[] | select(.os=="macos" and .cpu=="arm64") | .sha256' tools/tools.lock.json)
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/aspect" "$url"
          echo "${sha}  $RUNNER_TEMP/bin/aspect" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/bin/aspect"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: aspect format --task:name format

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies via Brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install bazelisk
      - name: Install Aspect CLI
        run: |
          url=$(jq -r '.aspect.binaries[] | select(.os=="macos" and .cpu=="arm64") | .url' tools/tools.lock.json)
          sha=$(jq -r '.aspect.binaries[] | select(.os=="macos" and .cpu=="arm64") | .sha256' tools/tools.lock.json)
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/aspect" "$url"
          echo "${sha}  $RUNNER_TEMP/bin/aspect" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/bin/aspect"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: aspect lint --task:name lint -- //...

