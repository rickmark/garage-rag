name: macOS build

# `aspect test //...` on macOS: the app, its XPC services, and the vendored
# Postgres, ICU, Python.framework and llama.cpp built from source. It is by far
# the slowest check, so:
#
# - Pull requests run it only when the build could have changed. Python-only
#   edits are covered by ci.yaml's Linux `python` job. Run it by hand
#   (workflow_dispatch) when in doubt.
# - A push does not cancel a run in progress. The newest push waits for it, and
#   GitHub keeps only the latest waiting run, so a finished run always reports.
# - main runs it on every push, plus a nightly run that keeps main's Bazel caches
#   warm; pull requests restore main's caches.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "macapp/**"
      - "ext/**"
      - "bazel/**"
      - "tools/**"
      - "proto/**"
      - "data/**"
      - "**/BUILD.bazel"
      - "**/*.bzl"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelversion"
      - ".aspect/**"
      - "garage_python/pyproject.toml"
      - "garage_python/uv.lock"
      - ".github/workflows/macos.yaml"
      - ".github/actions/**"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  # Required by the Aspect CLI artifact upload feature.
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-aspect
      # A cold build of //... runs past the hosted runner's 6h job limit, so
      # Bazel's disk and repository caches carry the work across runs.
      - name: Restore Bazel caches
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}-
            bazel-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure Bazel for CI
        # user.bazelrc is git-ignored and try-imported last by .bazelrc.
        #
        # - Writing the site-packages tree artifacts (tens of thousands of files)
        #   into the disk cache ran Bazel out of file descriptors ("Too many open
        #   files"), even at 65536. The actions that produce them only copy and
        #   sign files, so they stay out of the cache (no-cache; no-remote-cache
        #   still uses the disk cache) and re-run on each fresh runner.
        # - --build_tests_only: build what the tests need, not every non-manual
        #   target in //....
        # - --noapple_generate_dsym: .bazelrc asks for dSYMs on every build, and
        #   dsymutil over llama.cpp, Python and Postgres is slow; tests never use them.
        run: |
          {
            echo "common --disk_cache=$HOME/.cache/bazel-disk --repository_cache=$HOME/.cache/bazel-repo"
            echo "common --modify_execution_info=^(PythonSitePackages|CopyToDirectory|Codesign)\$=+no-cache"
            echo "startup --host_jvm_args=-XX:-MaxFDLimit"
            echo "test --build_tests_only"
            echo "build --noapple_generate_dsym"
          } >> user.bazelrc
          cat user.bazelrc
      - run: |
          # Headroom for the rest: the runner's shell default is 256, and on macOS
          # the JVM caps Bazel at 10240 unless told not to (-MaxFDLimit above).
          ulimit -n 65536 2>/dev/null || ulimit -n "$(sysctl -n kern.maxfilesperproc)"
          echo "open file limit: $(ulimit -n)"
          aspect test --task:name test -- //...
        # Stop before the 6h limit: a job the runner kills skips its remaining
        # steps, so the save below would never run and the next run would start
        # cold again.
        timeout-minutes: 320
      - name: Save Bazel caches
        if: always() && steps.bazel-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
