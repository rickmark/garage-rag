name: Set up the Aspect CLI
description: >-
  Installs the Aspect CLI launcher pinned by tools/tools.lock.json for this
  runner's OS and CPU (the CLI version it runs is pinned by .aspect/version.axl),
  and Bazelisk where the image lacks it.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
      run: |
        case "$RUNNER_OS" in
          macOS) os=macos ;;
          Linux) os=linux ;;
          *) echo "unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          ARM64) cpu=arm64 ;;
          X64) cpu=x86_64 ;;
          *) echo "unsupported runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        url=$(jq -r --arg os "$os" --arg cpu "$cpu" '.aspect.binaries[] | select(.os==$os and .cpu==$cpu) | .url' tools/tools.lock.json)
        sha=$(jq -r --arg os "$os" --arg cpu "$cpu" '.aspect.binaries[] | select(.os==$os and .cpu==$cpu) | .sha256' tools/tools.lock.json)
        mkdir -p "$RUNNER_TEMP/bin"
        curl -fsSL -o "$RUNNER_TEMP/bin/aspect" "$url"
        if command -v sha256sum >/dev/null; then
          echo "${sha}  $RUNNER_TEMP/bin/aspect" | sha256sum -c -
        else
          echo "${sha}  $RUNNER_TEMP/bin/aspect" | shasum -a 256 -c -
        fi
        chmod +x "$RUNNER_TEMP/bin/aspect"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        if ! command -v bazelisk >/dev/null && ! command -v bazel >/dev/null; then
          if [ "$os" = macos ]; then brew install bazelisk; else
            echo "no bazelisk or bazel on this image" >&2; exit 1
          fi
        fi
