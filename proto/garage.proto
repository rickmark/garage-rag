syntax = "proto3";

package garage;

// The GarageService is how the macOS app drives the Python pipeline: corpus
// reads for its views, every operation it would otherwise shell out to the
// `garage` CLI for (sources, models, backfill, fact distillation, schema,
// settings, MCP client registration), and the database facade the ingest and
// embed XPC workers persist through. Each RPC is a thin wrapper over the same
// garage_rag.ops function the CLI command calls.
service GarageService {
    // Ping / Healthcheck
    rpc Ping (PingRequest) returns (PingResponse);

    // Inspect server state
    rpc GetStatus (StatusRequest) returns (StatusResponse);

    // Version info
    rpc GetVersion (VersionRequest) returns (VersionResponse);

    // --- Search ---
    rpc Search (SearchRequest) returns (SearchResponse);

    // --- Documents & Chunks ---
    rpc ListDocuments (ListDocumentsRequest) returns (ListDocumentsResponse);
    rpc GetDocument (GetDocumentRequest) returns (GetDocumentResponse);

    // --- Sources ---
    rpc ListSources (ListSourcesRequest) returns (ListSourcesResponse);
    rpc AddSource (AddSourceRequest) returns (AddSourceResponse);
    rpc RemoveSource (RemoveSourceRequest) returns (RemoveSourceResponse);
    rpc Scan (ScanRequest) returns (ScanResponse);
    rpc SyncSources (SyncSourcesRequest) returns (SyncSourcesResponse);
    rpc ImportSourcesToConfig (ImportSourcesToConfigRequest) returns (ImportSourcesToConfigResponse);
    rpc Reconcile (ReconcileRequest) returns (ReconcileResponse);

    // --- Embedding Models ---
    rpc ListModels (ListModelsRequest) returns (ListModelsResponse);
    rpc RegisterModel (RegisterModelRequest) returns (RegisterModelResponse);
    rpc SetDefaultModel (SetDefaultModelRequest) returns (SetDefaultModelResponse);
    rpc DropModel (DropModelRequest) returns (DropModelResponse);
    rpc Backfill (BackfillRequest) returns (stream BackfillStatus);

    // --- Facts ---
    rpc EnrichFacts (EnrichFactsRequest) returns (stream EnrichFactsStatus);

    // --- Schema, Stats & Settings ---
    rpc GetStats (StatsRequest) returns (StatsResponse);
    rpc InitDb (InitDbRequest) returns (InitDbResponse);
    rpc GetSetting (GetSettingRequest) returns (GetSettingResponse);
    rpc SetSetting (SetSettingRequest) returns (SetSettingResponse);

    // --- MCP Client Registration ---
    rpc McpInstall (McpInstallRequest) returns (McpInstallResponse);
    rpc McpUninstall (McpUninstallRequest) returns (McpUninstallResponse);
    rpc McpStatus (McpStatusRequest) returns (McpStatusResponse);

    // --- Database Facade for Ingest & Embed Workers ---
    rpc BeginIngestSession (BeginIngestSessionRequest) returns (BeginIngestSessionResponse);
    rpc PersistScan (PersistScanRequest) returns (PersistScanResponse);
    rpc CheckDocumentStat (CheckDocumentStatRequest) returns (CheckDocumentStatResponse);
    rpc PersistDocument (PersistDocumentRequest) returns (PersistDocumentResponse);
    rpc FinalizeIngestSession (FinalizeIngestSessionRequest) returns (FinalizeIngestSessionResponse);
    rpc GetEmbeddingBatches (GetEmbeddingBatchesRequest) returns (GetEmbeddingBatchesResponse);
    rpc UpdateEmbeddings (UpdateEmbeddingsRequest) returns (UpdateEmbeddingsResponse);
}

// ---------------------------------------------------------------------------
// Base / Generic / System Messages
// ---------------------------------------------------------------------------

message PingRequest {
    string message = 1;
}

message PingResponse {
    string message = 1;
    int64 timestamp = 2;
}

message StatusRequest {}

message StatusResponse {
    string version = 1;
    bool is_ready = 2;
    int32 pid = 3;
    string db_status = 4;
    string server_type = 5;
}

message VersionRequest {}

message VersionResponse {
    string version = 1;
}

// ---------------------------------------------------------------------------
// Search
// ---------------------------------------------------------------------------

message SearchRequest {
    string query = 1;
    int32 limit = 2;
    string mode = 3; // hybrid | vector | fts
    string model = 4;
    repeated string corpus_classes = 5;
    repeated string trust_tiers = 6;
    repeated string sources = 7;
    string author = 8;
    bool full = 9;
}

message SearchHit {
    int32 rank = 1;
    string title = 2;
    string uri = 3;
    string corpus_class = 4;
    string trust_tier = 5;
    string matched_by = 6;
    float score = 7;
    string heading_path = 8;
    repeated string authors = 9;
    string text = 10;
    string snippet = 11;
}

message SearchResponse {
    repeated SearchHit hits = 1;
    int32 total_hits = 2;
    string formatted_output = 3;
}

// ---------------------------------------------------------------------------
// Documents & Chunks
// ---------------------------------------------------------------------------

message DocumentSummary {
    int64 id = 1;
    string uri = 2;
    string title = 3;
    string source_slug = 4;
    string corpus_class = 5;
    string trust_tier = 6;
    string mime = 7;
    string lang = 8;
    int64 byte_size = 9;
    int32 chunk_count = 10;
    string state = 11;
    string ingested_at = 12;
    int32 fact_count = 13;
}

message ListDocumentsRequest {
    string source = 1; // source slug filter; empty = all sources
    string corpus_class = 2; // filter; empty = all
    string trust_tier = 3; // filter; empty = all
    string query = 4; // substring match on title/uri
    int32 limit = 5;
    int32 offset = 6;
}

message ListDocumentsResponse {
    repeated DocumentSummary documents = 1;
    int64 total_count = 2;
    string formatted_output = 3;
}

message DocumentChunkInfo {
    int64 id = 1;
    int32 ord = 2;
    string text = 3;
    int32 token_count = 4;
    // Span of documents.content; unset when the chunk is not a verbatim slice of it.
    optional int32 char_start = 5;
    optional int32 char_end = 6;
    string heading_path = 7;
}

message DocumentAuthorInfo {
    string name = 1;
    string role = 2;
    float confidence = 3;
}

message DocumentFactInfo {
    int64 id = 1;
    int32 ord = 2;
    string fact = 3;
    string fact_class = 4;
    string attributes_json = 5;
    // Span of documents.content the fact was grounded to.
    optional int32 char_start = 6;
    optional int32 char_end = 7;
    string extractor = 8;
}

message DocumentDetail {
    int64 id = 1;
    string uri = 2;
    string title = 3;
    string source_slug = 4;
    string corpus_class = 5;
    string trust_tier = 6;
    string mime = 7;
    string lang = 8;
    int64 byte_size = 9;
    string extractor = 10;
    string extractor_version = 11;
    string chunker = 12;
    string meta_json = 13;
    string state = 14;
    string error = 15;
    string ingested_at = 16;
    repeated DocumentAuthorInfo authors = 17;
}

message GetDocumentRequest {
    int64 document_id = 1;
}

message GetDocumentResponse {
    DocumentDetail document = 1;
    repeated DocumentChunkInfo chunks = 2;
    string formatted_output = 3;
    repeated DocumentFactInfo facts = 4;
}

// ---------------------------------------------------------------------------
// Sources
// ---------------------------------------------------------------------------

message SourceInfo {
    string slug = 1;
    string kind = 2;
    string corpus_class = 3;
    string trust_tier = 4;
    bool allow_cloud_enrichment = 5;
    bool enabled = 6;
    string root = 7;
    int64 document_count = 8;
    int64 expected_elements = 9;
}

message ListSourcesRequest {}

message ListSourcesResponse {
    repeated SourceInfo sources = 1;
    string formatted_output = 2;
}

// ---------------------------------------------------------------------------
// Embedding Models
// ---------------------------------------------------------------------------

message ModelInfo {
    string slug = 1;
    string provider = 2;
    string model_ref = 3;
    int32 dims = 4;
    int32 stored_dims = 5;
    string storage_kind = 6;
    string index_kind = 7;
    string table_name = 8;
    bool is_default = 9;
    string model_id = 10;
    string distance = 11;  // cosine | l2 | inner_product
}

message ListModelsRequest {}

message ListModelsResponse {
    repeated ModelInfo models = 1;
    string formatted_output = 2;
}

// ---------------------------------------------------------------------------
// Stats
// ---------------------------------------------------------------------------

message StatsRequest {}

message StatsResponse {
    int64 documents = 1;
    int64 chunks = 2;
    int64 sources = 3;
    int64 models = 4;
    map<string, int64> chunks_by_model = 5;
    map<string, int64> documents_by_source = 6;
    string formatted_output = 7;
}

// ---------------------------------------------------------------------------
// Source Operations
// ---------------------------------------------------------------------------

message AddSourceRequest {
    string slug = 1;
    string root = 2;
    string kind = 3;          // default "filesystem"
    string corpus_class = 4;  // default "document"
    string trust = 5;         // default "authored"
    bool allow_cloud_enrichment = 6;
}

message AddSourceResponse {
    string slug = 1;
    string root = 2;
    bool created = 3;
    string message = 4;
}

message RemoveSourceRequest {
    string slug = 1;
}

message RemoveSourceResponse {
    string slug = 1;
    int64 deleted_documents = 2;
    string message = 3;
}

message ScanRequest {
    string source = 1;  // slug, or "*"/empty for every enabled source
    bool include_code = 2;
}

message SourceScanStatus {
    string source = 1;
    string kind = 2;
    string root = 3;
    int64 item_count = 4;
    string item_type = 5;
    double duration_seconds = 6;
    string error = 7;
}

message ScanResponse {
    repeated SourceScanStatus sources = 1;
    int64 total_items = 2;
    string message = 3;
}

message SyncSourcesRequest {
    bool dry_run = 1;
}

message UndeclaredSource {
    string slug = 1;
    int64 document_count = 2;
}

message SyncSourcesResponse {
    string config_path = 1;
    int32 declared = 2;
    bool applied = 3;
    repeated string created = 4;
    repeated string updated = 5;
    repeated UndeclaredSource undeclared = 6;
    string message = 7;
}

message ImportSourcesToConfigRequest {
    string path = 1;  // config file to update; empty = the one in use
}

message ImportSourcesToConfigResponse {
    string path = 1;
    repeated string added = 2;
    string message = 3;
}

message ReconcileRequest {
    string source = 1;
    bool apply = 2;
    bool force = 3;
}

message ReconcileResponse {
    string source = 1;
    int64 total_documents = 2;
    int64 candidates = 3;
    int64 deleted = 4;
    double fraction = 5;
    bool refused = 6;
    string reason = 7;
    string message = 8;
}

// ---------------------------------------------------------------------------
// Model Operations
// ---------------------------------------------------------------------------

message RegisterModelRequest {
    string slug = 1;
    int32 dims = 2;          // 0 = from the known-model table
    string model_ref = 3;
    string provider = 4;
    string model_id = 5;
    bool make_default = 6;
    string distance = 7;     // empty = models.json (cosine for models it does not list)
}

message RegisterModelResponse {
    ModelInfo model = 1;
    repeated string notes = 2;
    string message = 3;
}

message SetDefaultModelRequest {
    string slug = 1;
}

message SetDefaultModelResponse {
    string message = 1;
}

message DropModelRequest {
    string slug = 1;
}

message DropModelResponse {
    string message = 1;
}

message BackfillRequest {
    string model = 1;  // slug, or "*"/empty for every model
    int32 batch_size = 2;
    int32 limit = 3;
    bool skip_verify = 4;
}

// One step: phase is complete | skipped | started | progress | finished.
message BackfillStatus {
    string model_slug = 1;
    string phase = 2;
    int64 total = 3;
    int64 embedded = 4;
    int64 failed = 5;
    int64 remaining = 6;
    int64 batches = 7;
    string message = 8;
}

// ---------------------------------------------------------------------------
// Fact Distillation
// ---------------------------------------------------------------------------

message EnrichFactsRequest {
    string source = 1;       // slug, or "*"/empty for all sources
    int64 document_id = 2;   // > 0: just this document, ignoring source
    string model = 3;        // empty = facts.model
    string provider = 4;     // empty = facts.provider
}

// phase is started (total, model, provider) | document (one per document) |
// finished (the totals).
message EnrichFactsStatus {
    string phase = 1;
    int64 total = 2;
    int64 index = 3;
    int64 document_id = 4;
    string document_uri = 5;
    int64 facts = 6;
    string error = 7;
    string model = 8;
    string provider = 9;
    int64 enriched = 10;
    int64 failed = 11;
    string message = 12;
}

// ---------------------------------------------------------------------------
// Schema & Settings
// ---------------------------------------------------------------------------

message InitDbRequest {
    string schema_dir = 1;  // empty = the bundled schema
}

message InitDbResponse {
    repeated string applied = 1;
    string message = 2;
}

message GetSettingRequest {
    string name = 1;  // SECTION.KEY, e.g. facts.model
}

message GetSettingResponse {
    string name = 1;
    string value_json = 2;
}

message SetSettingRequest {
    string name = 1;
    string value = 2;  // as on the command line: true/false, numbers, comma-separated lists
    string path = 3;   // config file; empty = the one in use, else ~/.garage.json
}

message SetSettingResponse {
    string name = 1;
    string value_json = 2;
    string path = 3;
}

// ---------------------------------------------------------------------------
// MCP Client Registration
// ---------------------------------------------------------------------------

message McpInstallRequest {
    string target = 1;       // a client key; default "project"
    string path = 2;         // write this config file instead of a known target
    bool all = 3;            // every detected client config
    string name = 4;         // server name; default "garage-rag"
    bool stdio = 5;          // register a spawned command instead of the HTTP URL
    string host = 6;
    int32 port = 7;
    string route = 8;
    bool force = 9;
    bool dry_run = 10;
}

message McpTargetOutcome {
    string key = 1;
    string label = 2;
    string path = 3;
    bool written = 4;
    bool created_file = 5;
    bool replaced_entry = 6;
    string backup_path = 7;
    string skipped = 8;
    string preview_json = 9;
}

message McpInstallResponse {
    string url = 1;
    string command = 2;
    repeated string args = 3;
    bool fell_back = 4;
    repeated McpTargetOutcome outcomes = 5;
    string message = 6;
}

message McpUninstallRequest {
    string target = 1;
    string path = 2;
    string name = 3;
}

message McpUninstallResponse {
    string path = 1;
    bool removed = 2;
    string message = 3;
}

message McpStatusRequest {}

message McpClientInfo {
    string key = 1;
    string label = 2;
    string path = 3;
    bool registered = 4;
    bool config_exists = 5;
}

message McpStatusResponse {
    string server_command = 1;
    repeated McpClientInfo clients = 2;
}

// ---------------------------------------------------------------------------
// Database Facade for Ingest Workers
// ---------------------------------------------------------------------------

message BeginIngestSessionRequest {
    string source_slug = 1;
    bool include_code = 2;
}

message BeginIngestSessionResponse {
    int64 source_id = 1;
    string slug = 2;
    string root = 3;
    string default_class = 4;
    string default_trust = 5;
    bool allow_cloud_enrichment = 6;
    int64 run_id = 7;
    repeated string source_slugs = 8;
    string kind = 9;  // filesystem | git | sqlite | maildir: picks the scanner
}

message PersistScanRequest {
    string source_slug = 1;
    int64 item_count = 2;
    string item_type = 3;
    double duration_seconds = 4;
    map<string, int64> details = 5;
    string error = 6;
}

message PersistScanResponse {
    bool success = 1;
}

message CheckDocumentStatRequest {
    string source_slug = 1;
    string uri = 2;
}

message CheckDocumentStatResponse {
    bool exists = 1;
    int64 byte_size = 2;
    double mtime = 3;
    string content_sha256 = 4;
    string chunker = 5;
    string state = 6;
    string source_sha256 = 7;
}

message DocumentAuthorPayload {
    string name = 1;
    string role = 2;
    float confidence = 3;
    string evidence = 4;
    map<string, string> identities = 5;
    bool is_self = 6;
}

message DocumentChunkPayload {
    int32 ord = 1;
    string text = 2;
    int32 token_count = 3;
    // Unset when unknown: 0 is a real offset, so it cannot mean "none".
    optional int32 char_start = 4;
    optional int32 char_end = 5;
    string heading_path = 6;
    string chunk_sha256 = 7;
    string chunker = 8;
}

message PersistDocumentRequest {
    int64 run_id = 1;
    string source_slug = 2;
    string uri = 3;
    string action = 4;
    string title = 5;
    string lang = 6;
    int64 byte_size = 7;
    double mtime = 8;
    string source_sha256 = 9;
    string content_sha256 = 10;
    string extractor = 11;
    string extractor_version = 12;
    string chunker = 13;
    string content = 14;
    string meta_json = 15;
    string corpus_class = 16;
    string trust_tier = 17;
    string error = 18;
    repeated DocumentAuthorPayload authors = 19;
    repeated DocumentChunkPayload chunks = 20;
}

message PersistDocumentResponse {
    bool success = 1;
    int32 chunks_written = 2;
    string error = 3;
}

message FinalizeIngestSessionRequest {
    int64 run_id = 1;
    bool completed = 2;
    int64 seen_count = 3;
    int64 indexed_count = 4;
    int64 skipped_count = 5;
    int64 failed_count = 6;
    int64 placeholder_count = 7;
    int64 materialized_count = 8;
    int64 materialized_bytes = 9;
    repeated string errors = 10;
}

message FinalizeIngestSessionResponse {
    bool success = 1;
}

message EmbeddingChunkItem {
    int64 chunk_id = 1;
    string text = 2;
}

message GetEmbeddingBatchesRequest {
    string model_slug = 1;
    int32 batch_size = 2;
    int32 limit = 3;
}

message GetEmbeddingBatchesResponse {
    string model_slug = 1;
    string table_name = 2;
    string provider = 3;
    string model_ref = 4;
    int32 dims = 5;
    int32 stored_dims = 6;
    string storage_kind = 7;
    string index_kind = 8;
    int64 total_pending = 9;
    repeated EmbeddingChunkItem chunks = 10;
    bool has_more = 11;
}

message ChunkEmbeddingItem {
    int64 chunk_id = 1;
    repeated float vector = 2;
}

message UpdateEmbeddingsRequest {
    string model_slug = 1;
    repeated ChunkEmbeddingItem embeddings = 2;
}

message UpdateEmbeddingsResponse {
    bool success = 1;
    int32 count = 2;
    string error = 3;
}
