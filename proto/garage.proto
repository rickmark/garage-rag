syntax = "proto3";

package garage;

// The GarageService is the bridge between the macOS app and the Python
// pipeline: read-only corpus access for the app's Search and Documents views,
// plus the database facade the ingest and embed XPC workers persist through.
// Everything that mutates configuration or runs a pipeline stage is a `garage`
// CLI command the app invokes directly.
service GarageService {
    // Ping / Healthcheck
    rpc Ping (PingRequest) returns (PingResponse);

    // Inspect server state
    rpc GetStatus (StatusRequest) returns (StatusResponse);

    // Version info
    rpc GetVersion (VersionRequest) returns (VersionResponse);

    // --- Search ---
    rpc Search (SearchRequest) returns (SearchResponse);

    // --- Documents & Chunks ---
    rpc ListDocuments (ListDocumentsRequest) returns (ListDocumentsResponse);
    rpc GetDocument (GetDocumentRequest) returns (GetDocumentResponse);

    // --- Sources, Models & Stats ---
    rpc ListSources (ListSourcesRequest) returns (ListSourcesResponse);
    rpc ListModels (ListModelsRequest) returns (ListModelsResponse);
    rpc GetStats (StatsRequest) returns (StatsResponse);

    // --- Database Facade for Ingest & Embed Workers ---
    rpc BeginIngestSession (BeginIngestSessionRequest) returns (BeginIngestSessionResponse);
    rpc PersistScan (PersistScanRequest) returns (PersistScanResponse);
    rpc CheckDocumentStat (CheckDocumentStatRequest) returns (CheckDocumentStatResponse);
    rpc PersistDocument (PersistDocumentRequest) returns (PersistDocumentResponse);
    rpc FinalizeIngestSession (FinalizeIngestSessionRequest) returns (FinalizeIngestSessionResponse);
    rpc GetEmbeddingBatches (GetEmbeddingBatchesRequest) returns (GetEmbeddingBatchesResponse);
    rpc UpdateEmbeddings (UpdateEmbeddingsRequest) returns (UpdateEmbeddingsResponse);
}

// ---------------------------------------------------------------------------
// Base / Generic / System Messages
// ---------------------------------------------------------------------------

message PingRequest {
    string message = 1;
}

message PingResponse {
    string message = 1;
    int64 timestamp = 2;
}

message StatusRequest {}

message StatusResponse {
    string version = 1;
    bool is_ready = 2;
    int32 pid = 3;
    string db_status = 4;
    string server_type = 5;
}

message VersionRequest {}

message VersionResponse {
    string version = 1;
}

// ---------------------------------------------------------------------------
// Search
// ---------------------------------------------------------------------------

message SearchRequest {
    string query = 1;
    int32 limit = 2;
    string mode = 3; // hybrid | vector | fts
    string model = 4;
    repeated string corpus_classes = 5;
    repeated string trust_tiers = 6;
    repeated string sources = 7;
    string author = 8;
    bool full = 9;
}

message SearchHit {
    int32 rank = 1;
    string title = 2;
    string uri = 3;
    string corpus_class = 4;
    string trust_tier = 5;
    string matched_by = 6;
    float score = 7;
    string heading_path = 8;
    repeated string authors = 9;
    string text = 10;
    string snippet = 11;
}

message SearchResponse {
    repeated SearchHit hits = 1;
    int32 total_hits = 2;
    string formatted_output = 3;
}

// ---------------------------------------------------------------------------
// Documents & Chunks
// ---------------------------------------------------------------------------

message DocumentSummary {
    int64 id = 1;
    string uri = 2;
    string title = 3;
    string source_slug = 4;
    string corpus_class = 5;
    string trust_tier = 6;
    string mime = 7;
    string lang = 8;
    int64 byte_size = 9;
    int32 chunk_count = 10;
    string state = 11;
    string ingested_at = 12;
    int32 fact_count = 13;
}

message ListDocumentsRequest {
    string source = 1; // source slug filter; empty = all sources
    string corpus_class = 2; // filter; empty = all
    string trust_tier = 3; // filter; empty = all
    string query = 4; // substring match on title/uri
    int32 limit = 5;
    int32 offset = 6;
}

message ListDocumentsResponse {
    repeated DocumentSummary documents = 1;
    int64 total_count = 2;
    string formatted_output = 3;
}

message DocumentChunkInfo {
    int64 id = 1;
    int32 ord = 2;
    string text = 3;
    int32 token_count = 4;
    int32 char_start = 5;
    int32 char_end = 6;
    string heading_path = 7;
}

message DocumentAuthorInfo {
    string name = 1;
    string role = 2;
    float confidence = 3;
}

message DocumentFactInfo {
    int64 id = 1;
    int32 ord = 2;
    string fact = 3;
    string fact_class = 4;
    string attributes_json = 5;
    int32 char_start = 6;
    int32 char_end = 7;
    string extractor = 8;
}

message DocumentDetail {
    int64 id = 1;
    string uri = 2;
    string title = 3;
    string source_slug = 4;
    string corpus_class = 5;
    string trust_tier = 6;
    string mime = 7;
    string lang = 8;
    int64 byte_size = 9;
    string extractor = 10;
    string extractor_version = 11;
    string chunker = 12;
    string meta_json = 13;
    string state = 14;
    string error = 15;
    string ingested_at = 16;
    repeated DocumentAuthorInfo authors = 17;
}

message GetDocumentRequest {
    int64 document_id = 1;
}

message GetDocumentResponse {
    DocumentDetail document = 1;
    repeated DocumentChunkInfo chunks = 2;
    string formatted_output = 3;
    repeated DocumentFactInfo facts = 4;
}

// ---------------------------------------------------------------------------
// Sources
// ---------------------------------------------------------------------------

message SourceInfo {
    string slug = 1;
    string kind = 2;
    string corpus_class = 3;
    string trust_tier = 4;
    bool allow_cloud_enrichment = 5;
    bool enabled = 6;
    string root = 7;
    int64 document_count = 8;
    int64 expected_elements = 9;
}

message ListSourcesRequest {}

message ListSourcesResponse {
    repeated SourceInfo sources = 1;
    string formatted_output = 2;
}

// ---------------------------------------------------------------------------
// Embedding Models
// ---------------------------------------------------------------------------

message ModelInfo {
    string slug = 1;
    string provider = 2;
    string model_ref = 3;
    int32 dims = 4;
    int32 stored_dims = 5;
    string storage_kind = 6;
    string index_kind = 7;
    string table_name = 8;
    bool is_default = 9;
    string model_id = 10;
}

message ListModelsRequest {}

message ListModelsResponse {
    repeated ModelInfo models = 1;
    string formatted_output = 2;
}

// ---------------------------------------------------------------------------
// Stats
// ---------------------------------------------------------------------------

message StatsRequest {}

message StatsResponse {
    int64 documents = 1;
    int64 chunks = 2;
    int64 sources = 3;
    int64 models = 4;
    map<string, int64> chunks_by_model = 5;
    map<string, int64> documents_by_source = 6;
    string formatted_output = 7;
}

// ---------------------------------------------------------------------------
// Database Facade for Ingest Workers
// ---------------------------------------------------------------------------

message BeginIngestSessionRequest {
    string source_slug = 1;
    bool include_code = 2;
}

message BeginIngestSessionResponse {
    int64 source_id = 1;
    string slug = 2;
    string root = 3;
    string default_class = 4;
    string default_trust = 5;
    bool allow_cloud_enrichment = 6;
    int64 run_id = 7;
    repeated string source_slugs = 8;
}

message PersistScanRequest {
    string source_slug = 1;
    int64 item_count = 2;
    string item_type = 3;
    double duration_seconds = 4;
    map<string, int64> details = 5;
    string error = 6;
}

message PersistScanResponse {
    bool success = 1;
}

message CheckDocumentStatRequest {
    string source_slug = 1;
    string uri = 2;
}

message CheckDocumentStatResponse {
    bool exists = 1;
    int64 byte_size = 2;
    double mtime = 3;
    string content_sha256 = 4;
    string chunker = 5;
    string state = 6;
    string source_sha256 = 7;
}

message DocumentAuthorPayload {
    string name = 1;
    string role = 2;
    float confidence = 3;
    string evidence = 4;
    map<string, string> identities = 5;
    bool is_self = 6;
}

message DocumentChunkPayload {
    int32 ord = 1;
    string text = 2;
    int32 token_count = 3;
    int32 char_start = 4;
    int32 char_end = 5;
    string heading_path = 6;
    string chunk_sha256 = 7;
    string chunker = 8;
}

message PersistDocumentRequest {
    int64 run_id = 1;
    string source_slug = 2;
    string uri = 3;
    string action = 4;
    string title = 5;
    string lang = 6;
    int64 byte_size = 7;
    double mtime = 8;
    string source_sha256 = 9;
    string content_sha256 = 10;
    string extractor = 11;
    string extractor_version = 12;
    string chunker = 13;
    string content = 14;
    string meta_json = 15;
    string corpus_class = 16;
    string trust_tier = 17;
    string error = 18;
    repeated DocumentAuthorPayload authors = 19;
    repeated DocumentChunkPayload chunks = 20;
}

message PersistDocumentResponse {
    bool success = 1;
    int32 chunks_written = 2;
    string error = 3;
}

message FinalizeIngestSessionRequest {
    int64 run_id = 1;
    bool completed = 2;
    int64 seen_count = 3;
    int64 indexed_count = 4;
    int64 skipped_count = 5;
    int64 failed_count = 6;
    int64 placeholder_count = 7;
    int64 materialized_count = 8;
    int64 materialized_bytes = 9;
    repeated string errors = 10;
}

message FinalizeIngestSessionResponse {
    bool success = 1;
}

message EmbeddingChunkItem {
    int64 chunk_id = 1;
    string text = 2;
}

message GetEmbeddingBatchesRequest {
    string model_slug = 1;
    int32 batch_size = 2;
    int32 limit = 3;
}

message GetEmbeddingBatchesResponse {
    string model_slug = 1;
    string table_name = 2;
    string provider = 3;
    string model_ref = 4;
    int32 dims = 5;
    int32 stored_dims = 6;
    string storage_kind = 7;
    string index_kind = 8;
    int64 total_pending = 9;
    repeated EmbeddingChunkItem chunks = 10;
    bool has_more = 11;
}

message ChunkEmbeddingItem {
    int64 chunk_id = 1;
    repeated float vector = 2;
}

message UpdateEmbeddingsRequest {
    string model_slug = 1;
    repeated ChunkEmbeddingItem embeddings = 2;
}

message UpdateEmbeddingsResponse {
    bool success = 1;
    int32 count = 2;
    string error = 3;
}
