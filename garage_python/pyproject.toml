[project]
name = "garage_rag"
version = "0.1.0"
description = "Local-first personal RAG pipeline over Postgres + pgvector, with authorship attribution and an MCP server"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rick Mark" }]
requires-python = ">=3.13,<3.15"

dependencies = [
    # storage
    "sqlalchemy>=2.0",
    "psycopg[pool]>=3.2",
    "pgvector>=0.5,<0.6",
    # chunking (langchain-community is sunset; only the splitters are used)
    "langchain-text-splitters>=1.1.2,<2",
    # embeddings
    "ollama>=0.6.1",
    "openai>=1.0",
    # document extraction (all permissive licenses; PyMuPDF avoided due to AGPL)
    "pypdf>=6.16",
    "pdfplumber>=0.11.10",
    # Not imported directly: pulled in transitively by pdfminer-six (pdfplumber)
    # and google-auth (langextract). Pinned without recorded reason since the
    # initial import; keep the ceiling until someone verifies 44+ against both.
    "cryptography<44.0.0",
    "python-docx>=1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    # OCR
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    # fact extraction from documents (https://github.com/google/langextract)
    "langextract>=1.7.0",
    # MCP server (2.x renamed FastMCP -> MCPServer; 1.x is incompatible)
    "mcp[cli]==2.1.0",
    # HTTP transport for garage-mcp (mcp_server/server.py imports it directly)
    "uvicorn>=0.30",
    # plumbing
    "typer>=0.15",
    "pydantic>=2.7.4",
    "rich>=13.9",
    "pyyaml>=6.0",
    # A runtime dep on purpose: the Bazel @pypi hub (--@pypi//dep_group=garage_rag)
    # only exposes packages reachable from [project.dependencies], so the py_test
    # targets can't resolve @pypi//pytest from an optional/dev group.
    "pytest>=9.1.1",
    "anthropic>=1.0.0",
    # Not imported by garage_rag; //tools/pex builds the garage/garage-mcp
    # PEX + scie binaries from @pypi//pex.
    "pex>=2.101.0",
    # gRPC & Protobuf
    "grpcio>=1.68.0",
    "protobuf>=5.29.0",
]

[project.optional-dependencies]
# Local tooling for the uv venv only; the Bazel @pypi hub does not expose this group.
dev = ["pytest-asyncio>=0.24", "ruff>=0.8", "grpcio-tools>=1.68.0"]

[project.scripts]
garage = "garage_rag.cli:main_cli"
garage-mcp = "garage_rag.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garage_rag"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["garage_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ty]
exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi"]

[tool.ty.rules]
unresolved-import = "ignore"
