[project]
name = "garage_rag"
version = "1.5.0"
description = "Local-first personal RAG pipeline over Postgres + pgvector, with authorship attribution and an MCP server"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rick Mark" }]
requires-python = ">=3.13,<3.15"

dependencies = [
    # storage
    "sqlalchemy>=2.0",
    "psycopg[pool]>=3.2",
    "pgvector>=0.5,<0.6",
    # document extraction (all permissive licenses; PyMuPDF avoided due to AGPL)
    "pypdf>=6.16",
    "pdfplumber>=0.11.10",
    # Not imported directly: pulled in transitively by pdfminer-six (pdfplumber).
    # Pinned without recorded reason since the initial import; keep the ceiling
    # until someone verifies 44+ against it.
    "cryptography<44.0.0",
    "python-docx>=1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    # OCR
    "pillow>=11.0",
    # fact extraction: the vendored LangExtract subset (garage_rag/enrich/langextract)
    # needs regex for its tokenizer.
    "regex>=2023.0.0",
    # the egress guard's HTTP client (garage_rag/net/egress.py), which every
    # outbound HTTP request goes through, garage_rag/inference's included
    "httpx>=0.28",
    # MCP server (2.x renamed FastMCP -> MCPServer; 1.x is incompatible)
    "mcp[cli]==2.1.0",
    # HTTP transport for garage-mcp (mcp_server/server.py imports it directly)
    "uvicorn>=0.30",
    # plumbing
    "typer>=0.15",
    "pydantic>=2.7.4",
    "rich>=13.9",
    "pyyaml>=6.0",
    # A runtime dep on purpose: the Bazel @pypi hub (--@pypi//dep_group=garage_rag)
    # only exposes packages reachable from [project.dependencies], so the py_test
    # targets can't resolve @pypi//pytest from an optional/dev group.
    "pytest>=9.1.1",
    # gRPC & Protobuf
    "grpcio>=1.68.0",
    "protobuf>=5.29.0",
    # Not imported by garage_rag: the macOS app's embedded interpreter imports them at start-up so
    # ssl's default contexts verify against the system trust store (certifi is the fallback). The
    # bundled OpenSSL has no CA files of its own.
    "truststore>=0.10",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
# Local tooling for the uv venv only; the Bazel @pypi hub does not expose this group.
dev = [
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "grpcio-tools>=1.68.0",
    # tools/swiftcheck: Swift syntax checking where no Swift toolchain exists (Linux, web sessions)
    "tree-sitter>=0.25",
    "tree-sitter-swift>=0.7",
]

[project.scripts]
garage = "garage_rag.cli:main_cli"
garage-mcp = "garage_rag.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garage_rag"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.ruff]
line-length = 120
target-version = "py313"
# Vendored third-party code keeps its upstream style (see its __init__ docstring).
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi", "src/garage_rag/enrich/langextract"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["garage_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ty.src]
# Generated protobuf stubs are excluded from type checking, as they are from Ruff
# above. `exclude` lives under `src` for ty; a top-level `[tool.ty] exclude` is a
# hard config error that makes ty exit non-zero before it checks anything.
exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi", "src/garage_rag/enrich/langextract"]

[tool.ty.rules]
unresolved-import = "ignore"
