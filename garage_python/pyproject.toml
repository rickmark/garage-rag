[project]
name = "garage_rag"
version = "0.1.0"
description = "Local-first personal RAG pipeline over Postgres + pgvector, with authorship attribution and an MCP server"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rick Mark" }]
requires-python = ">=3.13,<3.15"

dependencies = [
    # storage
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.5,<0.6",
    # chunking (langchain-community is sunset; only the splitters are used)
    "langchain-text-splitters>=1.1.2,<2",
    # embeddings
    "ollama>=0.6.1",
    "openai>=1.0",
    # document extraction (all permissive licenses; PyMuPDF avoided due to AGPL)
    "pypdf>=6.16",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    # OCR
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    # MCP server (2.x renamed FastMCP -> MCPServer; 1.x is incompatible)
    "mcp[cli]==2.1.0",
    # plumbing
    "typer>=0.15",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "pyyaml>=6.0",
    "pytest>=9.1.1",
    "anthropic>=1.0.0",
    "pex>=2.101.0"
]

[project.optional-dependencies]
# Cloud OCR fallback only. Never used for trust_tier='communication'.
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
garage = "garage_rag.cli:app"
garage-mcp = "garage_rag.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garage_rag"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true